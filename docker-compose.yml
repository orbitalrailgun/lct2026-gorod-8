services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concorde"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://concorde:concorde@db:5432/concorde
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
